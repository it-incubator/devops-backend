name: Deploy

on:
  push:
    branches: [main]

jobs:
  # checks:
  #   uses: ./.github/workflows/pr-check.yml

  build:
    # needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        env: 
          IMAGE_SHA: ${{ secrets.DOCKERHUB_USER }}/backend:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ secrets.DOCKERHUB_USER }}/backend:latest
        run: |
          docker buildx build --platform linux/amd64 -t $IMAGE_SHA -t $IMAGE_LATEST --push .



